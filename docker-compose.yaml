---
services:
  caos-vision:
    build: .
    ports:
      - "64500:5000"
    environment:
      - REDIS_URL=redis://valkey:6379/0
      - FLASK_ENV=production
      - ADMIN_USER=admin
      - ADMIN_PASS=mi_password_seguro
      - SESSION_SECRET_KEY=mi_clave_secreta_compleja
    depends_on:
      - valkey
    volumes:
      - ./app:/app

  valkey:
    image: valkey/valkey
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  valkey_data: