---
services:
  caos-vision:
    build: .
    ports:
      - "64500:5000"
    environment:
      - REDIS_URL=redis://valkey:6379/0
      - FLASK_ENV=production
      - GUNICORN_WORKERS=4
      - SESSION_COOKIE_SECURE=true
      - ADMIN_USER=admin
      - ADMIN_PASS=mi_password_seguro
      - SESSION_SECRET_KEY=mi_clave_secreta_compleja
      # Configuración para Cloudflare Tunnel
      - ALLOWED_ORIGINS=
      - CLOUDFLARE_TUNNEL=true
      - BEHIND_PROXY=true
    # Usar el entrypoint definido en el Dockerfile
    # command se puede omitir ya que CMD está definido en Dockerfile
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/tmp
    volumes:
      - ./logs:/app/logs:rw

  valkey:
    image: valkey/valkey:7-alpine
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    sysctls:
      - net.core.somaxconn=65535
    command: [
      "valkey-server",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",
      "--save", "60", "1000"
    ]

volumes:
  valkey_data: