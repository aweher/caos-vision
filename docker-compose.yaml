---
services:
  caos-viewer:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "64500:8000"
    environment:
      - REDIS_URL=redis://valkey:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - DEBUG=false
      - CLOUDFLARE_TUNNEL=${CLOUDFLARE_TUNNEL:-false}
      - BEHIND_PROXY=${BEHIND_PROXY:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/app/logs:rw
    command: ["uvicorn", "viewer_main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  caos-admin:
    build:
      context: .
      platforms:
        - linux/amd64
        - linux/arm64
    ports:
      - "64501:8000"
    environment:
      - REDIS_URL=redis://valkey:6379/0
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-admin}
      - DEBUG=false
      - CLOUDFLARE_TUNNEL=${CLOUDFLARE_TUNNEL:-false}
      - BEHIND_PROXY=${BEHIND_PROXY:-false}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - VIEWER_URL=${VIEWER_URL:-}
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ./logs:/app/logs:rw
    command: ["uvicorn", "admin_main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health', timeout=5).raise_for_status()"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3

  valkey:
    image: valkey/valkey:7-alpine
    volumes:
      - valkey_data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: [
      "valkey-server",
      "--maxmemory", "256mb",
      "--maxmemory-policy", "allkeys-lru",
      "--save", "60", "1000"
    ]

volumes:
  valkey_data:
